name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sica-csr
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sica
          POSTGRES_PASSWORD: sica
          POSTGRES_DB: sica
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sica" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL_PRUEBAS: postgresql+psycopg://sica:sica@localhost:5432/sica_pruebas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sica-csr/backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sica-csr/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sica-csr/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
