# Entorno de desarrollo completo:  docker compose up --build
#   Frontend  http://localhost:5173
#   API       http://localhost:8000/docs
#   BD        localhost:5432 (sica / sica)
# Si un puerto ya está ocupado, cámbialo en el .env (PUERTO_WEB, PUERTO_API, PUERTO_DB).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sica
      POSTGRES_PASSWORD: sica
      POSTGRES_DB: sica
    ports:
      - "${PUERTO_DB:-5432}:5432"
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sica -d sica"]
      interval: 3s
      retries: 20

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://sica:sica@db:5432/sica
    # En desarrollo: migra, carga datos ficticios y recarga al guardar cambios
    command: sh -c "cd /srv/db && alembic upgrade head && python cargar_datos_prueba.py && cd /srv/backend && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/srv/backend
      - ./db:/srv/db
    ports:
      - "${PUERTO_API:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY: http://api:8000
    volumes:
      - ./frontend:/app
      - modulos_node:/app/node_modules
    ports:
      - "${PUERTO_WEB:-5173}:5173"
    depends_on:
      - api

volumes:
  datos_postgres:
  modulos_node:
