# Ejecutar desde la carpeta db/:  alembic upgrade head
# La URL de conexión se toma de DATABASE_URL (.env); ver migraciones/env.py.

[alembic]
script_location = %(here)s/migraciones
file_template = %%(rev)s_%%(slug)s
prepend_sys_path = %(here)s/../backend

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
level = NOTSET
formatter = generic
args = (sys.stderr,)
class = StreamHandler

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
